name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ios:
        description: iOS 빌드도 실행해요 (macOS 러너)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (build, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  android:
    name: Android (RN ${{ matrix.rn }})
    runs-on: ubuntu-latest
    needs: js
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # create-nativepiece의 TESTED_RN_VERSIONS와 맞춰요.
        rn: ['0.84', '0.85', '0.86', '0.87', '0.88']
    steps:
      # RN Android 빌드(NDK, Gradle 캐시, C++ debug·release 결과물)는 러너 기본 여유 공간(약 14GB)을 넘길 수 있어서,
      # 쓰지 않는 사전 설치 도구를 먼저 지워요.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Python /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby \
            /usr/local/share/powershell /usr/share/swift /usr/local/julia* /opt/microsoft /opt/google
          # RN이 쓰는 NDK(27.1.12297006)만 남겨요.
          find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 ! -name 27.1.12297006 -exec sudo rm -rf {} +
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # 검증하는 RN 버전(0.84~0.88)이 모두 요구하는 NDK 버전이에요 (react-native/gradle/libs.versions.toml).
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
      - run: npm ci
      - run: npm run build
      - name: Create sample module
        run: node packages/create-nativepiece/dist/index.js "$RUNNER_TEMP/sample" --rn ${{ matrix.rn }} --group io.nativepiece.ci --nativepiece "$GITHUB_WORKSPACE"
      - name: Doctor
        working-directory: ${{ runner.temp }}/sample
        run: npx nativepiece doctor || true
      - name: Build module (Android)
        working-directory: ${{ runner.temp }}/sample
        run: npx nativepiece build android
      - name: Build example host app
        working-directory: ${{ runner.temp }}/sample/example/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --console=plain :app:assembleDebug

  ios:
    name: iOS (RN ${{ matrix.rn }})
    if: startsWith(github.ref, 'refs/tags/') || inputs.ios
    runs-on: macos-latest
    needs: js
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rn: ['0.84', '0.85', '0.86', '0.87', '0.88']
    steps:
      # RN Android 빌드(NDK, Gradle 캐시, C++ debug·release 결과물)는 러너 기본 여유 공간(약 14GB)을 넘길 수 있어서,
      # 쓰지 않는 사전 설치 도구를 먼저 지워요.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Python /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby \
            /usr/local/share/powershell /usr/share/swift /usr/local/julia* /opt/microsoft /opt/google
          # RN이 쓰는 NDK(27.1.12297006)만 남겨요.
          find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 ! -name 27.1.12297006 -exec sudo rm -rf {} +
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create sample module
        run: node packages/create-nativepiece/dist/index.js "$RUNNER_TEMP/sample" --rn ${{ matrix.rn }} --group io.nativepiece.ci --nativepiece "$GITHUB_WORKSPACE"
      - name: Build module (iOS)
        working-directory: ${{ runner.temp }}/sample
        run: npx nativepiece build ios
      - name: Build example host app
        working-directory: ${{ runner.temp }}/sample/example/ios
        run: xcodebuild build -project ExampleHost.xcodeproj -scheme ExampleHost -destination 'generic/platform=iOS Simulator' -configuration Release CODE_SIGNING_ALLOWED=NO
