plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "{{androidPackage}}.example"
    compileSdk 36

    defaultConfig {
        applicationId "{{androidPackage}}.example"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // 예제라서 debug 키로 서명해요.
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    // 예제는 `npm run build:android`가 만든 로컬 저장소의 가장 최신 버전을 써요. 실제 앱에서는 버전을 고정해요.
    implementation("{{group}}:{{artifactId}}:+")
    implementation("{{group}}:{{artifactId}}-compose:+")
    implementation(platform("androidx.compose:compose-bom:2025.06.00"))
    implementation("androidx.compose.material3:material3")
}
