// Nativepiece는 New Architecture만 지원하므로 codegen 플러그인을 항상 적용한다.
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def getExtOrDefault(name, defaultValue) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

android {
    namespace "io.nativepiece.runtime"
    compileSdk getExtOrDefault("compileSdkVersion", 36)

    defaultConfig {
        minSdk getExtOrDefault("minSdkVersion", 24)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.java.srcDirs += ["${project.buildDir}/generated/source/codegen/java"]
}

kotlin {
    jvmToolchain(17)
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation("com.facebook.react:react-android")
}

react {
    jsRootDir = file("../src")
    libraryName = "NativepieceRuntimeSpec"
    codegenJavaPackageName = "io.nativepiece.runtime"
}
